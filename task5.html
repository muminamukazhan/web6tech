<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 5 | jQuery Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page container">
  <span class="badge">Task 5 · Part 3</span>
  <h1>Add &amp; Remove Elements</h1>
  <p class="lead">Manage a list with .append(), .prepend() and .remove().</p>
  <section class="box">
    <div class="btn-row" style="margin-top:0">
      <button class="btn" id="add">Add Item</button>
      <button class="btn" id="prepend">Prepend Item</button>
      <button class="btn light" id="remove">Remove Item</button>
    </div>
    <ul class="list" id="list">
      <li>Item 1</li>
      <li>Item 2</li>
    </ul>
    <div class="output" id="count"></div>
  </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/nav.js"></script>
<script>
$(document).ready(function () {
  var counter = 2;
  function updateCount() {
    $("#count").text("Items in list: " + $("#list li").length);
  }
  updateCount();
  $("#add").click(function () {
    counter++;
    $("#list").append("<li>Item " + counter + " (appended)</li>");
    updateCount();
  });
  $("#prepend").click(function () {
    counter++;
    $("#list").prepend("<li>Item " + counter + " (prepended)</li>");
    updateCount();
  });
  $("#remove").click(function () {
    $("#list li:last").remove();
    updateCount();
  });
});
</script>
</body>
</html>
