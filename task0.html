<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 0 | jQuery Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page container">
  <span class="badge">Task 0 · Part 1</span>
  <h1>Setup</h1>
  <p class="lead">jQuery is included from a CDN and the page logs a message when the document is ready.</p>
  <section class="box">
    <p>Open the browser console (F12) to see the output.</p>
    <div class="output" id="status">Waiting for document ready...</div>
    <div class="btn-row"><button class="btn" id="logBtn">Log message again</button></div>
  </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/nav.js"></script>
<script>
$(document).ready(function () {
  console.log("jQuery is ready!");
  $("#status").text("jQuery is ready! (see the console)");
  $("#logBtn").click(function () {
    console.log("jQuery is ready!");
    $("#status").fadeOut(150).fadeIn(150);
  });
});
</script>
</body>
</html>
