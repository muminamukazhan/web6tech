<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 10 | jQuery Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page container">
  <span class="badge">Task 10 · Part 4</span>
  <h1>Combined Animation</h1>
  <p class="lead">Opacity, size and movement are animated together in one .animate() call.</p>
  <section class="box wide">
    <div class="btn-row" style="margin-top:0">
      <button class="btn" id="start">Animate all</button>
      <button class="btn light" id="reset">Reset</button>
    </div>
    <div class="stage" id="stage">
      <div class="square" id="box"></div>
    </div>
  </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/nav.js"></script>
<script>
$(document).ready(function () {
  $("#start").click(function () {
    var targetLeft = ($("#stage").width() - 200) / 2;
    $("#box").stop(true).animate({
      opacity: 0.3,
      width: "200px",
      height: "200px",
      left: targetLeft + "px",
      top: "60px"
    }, 1500);
  });
  $("#reset").click(function () {
    $("#box").stop(true).animate({
      opacity: 1,
      width: "80px",
      height: "80px",
      left: "20px",
      top: "20px"
    }, 800);
  });
});
</script>
</body>
</html>
