<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 9 | jQuery Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page container">
  <span class="badge">Task 9 · Part 4</span>
  <h1>Sequential Animations</h1>
  <p class="lead">The box moves right, moves down, shrinks and returns to the original state.</p>
  <section class="box wide">
    <div class="btn-row" style="margin-top:0">
      <button class="btn" id="start">Start sequence</button>
      <button class="btn light" id="stop">Stop &amp; reset</button>
    </div>
    <div class="output" id="step">Step: waiting</div>
    <div class="stage" id="stage">
      <div class="square" id="box"></div>
    </div>
  </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/nav.js"></script>
<script>
$(document).ready(function () {
  var $box = $("#box");
  var original = { left: "20px", top: "20px", width: "80px", height: "80px" };
  function setStep(text) {
    $("#step").text("Step: " + text);
  }
  $("#start").click(function () {
    var right = $("#stage").width() - 80 - 20;
    $box.stop(true).css(original);
    setStep("1. move right");
    $box
      .animate({ left: right + "px" }, 900, function () {
        setStep("2. move down");
      })
      .animate({ top: "220px" }, 900, function () {
        setStep("3. shrink");
      })
      .animate({ width: "30px", height: "30px" }, 700, function () {
        setStep("4. return to original");
      })
      .animate(original, 1200, function () {
        setStep("done");
      });
  });
  $("#stop").click(function () {
    $box.stop(true).css(original);
    setStep("waiting");
  });
});
</script>
</body>
</html>
