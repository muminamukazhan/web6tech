<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 4 | jQuery Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page container">
  <span class="badge">Task 4 · Part 2</span>
  <h1>Slide Methods</h1>
  <p class="lead">A collapsible panel controlled with .slideUp(), .slideDown() and .slideToggle().</p>
  <section class="box">
    <div class="btn-row" style="margin-top:0">
      <button class="btn" id="up">Slide Up</button>
      <button class="btn" id="down">Slide Down</button>
      <button class="btn light" id="toggle">Slide Toggle</button>
    </div>
    <div class="panel" id="panel">
      <p><strong>Collapsible panel</strong></p>
      <p>This content slides up and down. jQuery animates the height of the element smoothly.</p>
      <p>Use the buttons above to collapse or expand the panel.</p>
    </div>
  </section>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/nav.js"></script>
<script>
$(document).ready(function () {
  $("#up").click(function () {
    $("#panel").slideUp(500);
  });
  $("#down").click(function () {
    $("#panel").slideDown(500);
  });
  $("#toggle").click(function () {
    $("#panel").slideToggle(500);
  });
});
</script>
</body>
</html>
